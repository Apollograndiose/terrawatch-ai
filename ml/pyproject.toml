[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrawatch-ml"
version = "0.1.0"
description = "Sentinel-1 SAR surface-water segmentation trained on Sen1Floods11 (TerraWatch AI)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "rasterio>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
unet = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["terrawatch_ml*"]
