name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.lock -e ./ml -e "./backend[dev]"
      - run: python ml/scripts/fetch_flood_demo.py --no-s2
      - run: ruff check backend/app ml/terrawatch_ml
      - run: cd backend && pytest -m "not network"
      - run: cd ml && pytest tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
  e2e:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.lock -e ./ml -e ./backend
      - run: .venv/bin/python ml/scripts/fetch_flood_demo.py
      - run: npm --prefix frontend ci && cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test
